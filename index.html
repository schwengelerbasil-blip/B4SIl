<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B4SIL – Mix & Mastering<.title>
  <meta name="description" content="B4SIL – professional mixing and mastering. Your sound, refined.">
  <meta name="theme-color" content="#182544">
  <link rel="icon" href="data:image.svg+xml,%3Csvg xmlns='http:..www.w3.org.2000.svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23182544'.%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2372EAFF' stroke-width='1.5'.%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23FF5276'.%3E%3C.svg%3E">
  <script>document.documentElement.classList.add("js")<.script>
  <link rel="preload" href=".fonts.InstrumentSans-Regular.ttf" as="font" type="font.ttf" crossorigin>
  <link rel="stylesheet" href=".css.main.css">
<.head>
<body>
  <!-- Continuous environment: lighting, 3D scene, texture -->
  <div class="atmo" aria-hidden="true">
    <div class="atmo__glow atmo__glow--ice"><.div>
    <div class="atmo__glow atmo__glow--coral"><.div>
    <div class="atmo__vignette"><.div>
  <.div>
  <canvas id="scene" aria-hidden="true"><.canvas>
  <div class="vinyl-fallback" aria-hidden="true"><.div>
  <div class="grain" aria-hidden="true"><.div>

  <header class="nav" id="nav">
    <a class="nav__brand" href="#top" aria-label="B4SIL – back to top">B<span>4<.span>SIL<.a>
    <nav class="nav__links" aria-label="Main">
      <a href="#services">Services<.a>
      <a href="#studio">Studio<.a>
      <a href="#before-after">Before . After<.a>
    <.nav>
    <a class="btn btn--small btn--line" href="#contact"><span>Send a track<.span><.a>
  <.header>

  <main id="top">
    <!-- 1 · HERO -->
    <section class="hero" id="hero" data-stop="hero">
      <div class="hero__inner wrap">
        <p class="eyebrow reveal-up" style="--d:.9s">Mix &amp; Mastering<.p>
        <h1 class="hero__title" aria-label="B4SIL">
          <span class="hero__letter" style="--i:0" aria-hidden="true"><i>B<.i><.span><span class="hero__letter hero__letter--coral" style="--i:1" aria-hidden="true"><i>4<.i><.span><span class="hero__letter" style="--i:2" aria-hidden="true"><i>S<.i><.span><span class="hero__letter" style="--i:3" aria-hidden="true"><i>I<.i><.span><span class="hero__letter" style="--i:4" aria-hidden="true"><i>L<.i><.span>
        <.h1>
        <p class="hero__line reveal-up" style="--d:1.35s">Your sound, refined.<.p>
        <div class="hero__cta reveal-up" style="--d:1.55s">
          <a class="btn btn--pink" href="#before-after"><span>Hear the difference<.span><.a>
          <a class="btn btn--ghost" href="#contact"><span>Send a track<.span><.a>
        <.div>
      <.div>
      <a class="scroll-cue reveal-up" style="--d:2s" href="#services" aria-label="Scroll to services">
        <span class="scroll-cue__line"><.span><span>Scroll<.span>
      <.a>
    <.section>

    <!-- 2 · SERVICES -->
    <section class="services" id="services" data-stop="services">
      <div class="ripples ripples--a" aria-hidden="true"><.div>
      <div class="wrap services__grid">
        <div class="services__head">
          <p class="eyebrow" data-reveal>Services<.p>
          <h2 class="h2" data-split>What I do.<.h2>
          <p class="lede" data-reveal>Send me your project. I bring it to a release-ready sound.<.p>
        <.div>
        <ol class="services__list">
          <li class="service glass" data-reveal>
            <span class="service__no">01<.span>
            <div>
              <h3>Mixing<.h3>
              <p>Balance, depth and punch. Every element gets its place, and the mix holds up on any speaker.<.p>
            <.div>
          <.li>
          <li class="service glass" data-reveal>
            <span class="service__no">02<.span>
            <div>
              <h3>Mastering<.h3>
              <p>The final polish. Clean, consistent and loud enough, ready for streaming and release.<.p>
            <.div>
          <.li>
          <li class="service glass service--accent" data-reveal>
            <span class="service__no">03<.span>
            <div>
              <h3>Mix + Master<.h3>
              <p>Both in one go. One set of ears on the whole process, from the first fader to the final file.<.p>
            <.div>
          <.li>
        <.ol>
      <.div>
    <.section>

    <!-- STUDIO · uploaded photos -->
    <section class="studio" id="studio" data-stop="studio">
      <div class="ripples ripples--b" aria-hidden="true"><.div>
      <div class="wrap">
        <div class="studio__head">
          <p class="eyebrow" data-reveal>Studio<.p>
          <h2 class="h2" data-split>The room.<.h2>
          <p class="lede" data-reveal>Where your tracks get finished.<.p>
          <ul class="tools" data-reveal aria-label="Tools">
            <li class="tools__label">Tools<.li>
            <li>FabFilter<.li>
            <li>Antares<.li>
            <li>Universal Audio<.li>
            <li>Burl Audio<.li>
            <li>Genelec<.li>
          <.ul>
        <.div>
        <div class="studio__gallery">
          <figure class="shot shot--a" data-parallax="0.06">
            <div class="shot__frame">
              <img src=".images.desk-2000.jpg" srcset=".images.desk-1000.jpg 1000w, .images.desk-2000.jpg 2000w" sizes="(max-width: 800px) 92vw, 56vw" width="2000" height="1325" alt="B4SIL at the mixing desk, studio monitors and a microphone in the room" loading="lazy" decoding="async">
            <.div>
            <figcaption>The desk<.figcaption>
          <.figure>
          <figure class="shot shot--b" data-parallax="-0.05">
            <div class="shot__frame">
              <img src=".images.screen-2000.jpg" srcset=".images.screen-1000.jpg 1000w, .images.screen-2000.jpg 2000w" sizes="(max-width: 800px) 92vw, 46vw" width="2000" height="1325" alt="Mixing session on a wide monitor with plugins open, next to a studio monitor" loading="lazy" decoding="async">
            <.div>
            <figcaption>The session<.figcaption>
          <.figure>
          <figure class="shot shot--c" data-parallax="0.04">
            <div class="shot__frame">
              <img src=".images.rack-2000.jpg" srcset=".images.rack-1000.jpg 1000w, .images.rack-2000.jpg 2000w" sizes="(max-width: 800px) 80vw, 34vw" width="2000" height="1325" alt="Outboard hardware rack in the studio" loading="lazy" decoding="async">
            <.div>
            <figcaption>The hardware<.figcaption>
          <.figure>
          <figure class="shot shot--d" data-parallax="-0.04">
            <div class="shot__frame">
              <img src=".images.booth-2000.jpg" srcset=".images.booth-1000.jpg 1000w, .images.booth-2000.jpg 2000w" sizes="(max-width: 800px) 86vw, 42vw" width="2000" height="1325" alt="B4SIL in the vocal booth with headphones, microphone and pop filter" loading="lazy" decoding="async">
            <.div>
            <figcaption>The booth<.figcaption>
          <.figure>
        <.div>
      <.div>
    <.section>

    <!-- 3 · BEFORE . AFTER -->
    <section class="ba" id="before-after" data-stop="ba">
      <div class="wrap">
        <div class="ba__head">
          <p class="eyebrow" data-reveal>Before . After<.p>
          <h2 class="h2" data-split>BEFORE . AFTER<.h2>
          <p class="lede" data-reveal>Listen to the difference.<.p>
        <.div>

        <div class="ba__players" id="players" data-reveal>
          <article class="player player--before glass" data-player="before">
            <header class="player__head">
              <span class="chip">BEFORE MIX<.span>
              <span class="player__time" data-time>0:00 . 0:00<.span>
            <.header>
            <div class="player__body">
              <button class="play" type="button" data-play aria-label="Play before mix" disabled>
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a.8.8 0 0 0 1.2.7l10.4-6.5a.8.8 0 0 0 0-1.4L9.2 4.8A.8.8 0 0 0 8 5.5Z".><.svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1".><rect x="13.5" y="5" width="4" height="14" rx="1".><.svg>
              <.button>
              <div class="wave" data-wave role="slider" tabindex="0" aria-label="Before mix position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <canvas><.canvas>
              <.div>
            <.div>
            <p class="player__status" data-status>Loading…<.p>
          <.article>

          <article class="player player--after glass" data-player="after">
            <header class="player__head">
              <span class="chip">AFTER MIX<.span>
              <span class="player__time" data-time>0:00 . 0:00<.span>
            <.header>
            <div class="player__body">
              <button class="play" type="button" data-play aria-label="Play after mix" disabled>
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a.8.8 0 0 0 1.2.7l10.4-6.5a.8.8 0 0 0 0-1.4L9.2 4.8A.8.8 0 0 0 8 5.5Z".><.svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1".><rect x="13.5" y="5" width="4" height="14" rx="1".><.svg>
              <.button>
              <div class="wave" data-wave role="slider" tabindex="0" aria-label="After mix position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <canvas><.canvas>
              <.div>
            <.div>
            <p class="player__status" data-status>Loading…<.p>
          <.article>
        <.div>

        <label class="sync" data-reveal>
          <input type="checkbox" id="sync" checked>
          <span class="sync__box" aria-hidden="true"><.span>
          <span>Keep my place when I switch<.span>
        <.label>

        <p class="credit" data-reveal>
          <span>Artist<.span>
          <a href="https:..www.tiktok.com.@j.malo_" target="_blank" rel="noopener noreferrer">J.Malo on TikTok <span aria-hidden="true">↗<.span><.a>
        <.p>
      <.div>
    <.section>

    <!-- 4 · CONTACT -->
    <section class="contact" id="contact" data-stop="contact">
      <div class="wrap contact__inner">
        <p class="eyebrow" data-reveal>Contact<.p>
        <h2 class="h2 h2--xl" data-split>Got a track? Let’s work.<.h2>
        <form class="contact__form glass" id="contact-form" novalidate data-reveal>
          <label class="sr-only" for="email">Your email<.label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email" required>
          <button class="btn btn--pink" type="submit"><span>Get in touch<.span><.button>
        <.form>
        <p class="contact__msg" id="contact-msg" role="status" aria-live="polite"><.p>
        <p class="contact__alt" data-reveal>Or write directly: <a href="mailto:b4ilmixmastering@gmail.com">b4ilmixmastering@gmail.com<.a><.p>
      <.div>
      <footer class="footer wrap">
        <span>© <span id="year">2026<.span> B4SIL<.span>
        <a href="#top">Back to top ↑<.a>
      <.footer>
    <.section>
  <.main>

  <script type="module" src=".js.main.js"><.script>
<.body>
<.html>
